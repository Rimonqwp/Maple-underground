# 集中数据库凭据（编译期由 Maven 资源过滤注入；不要手动填真实密码）。
# 真实值来自 build-secrets.cmd -> build-all.cmd 传入的 -D 参数；默认值见 underground_state/pom.xml。
# 所有数据源共用同一台 host（db.host）。新增数据源时在此追加一组 db.<name>.* 并在 pom 与 build 脚本同步。
db.host=${db.host}
db.port=${db.port}
db.params=${db.params}

db.state.database=${db.state.database}
db.state.user=${db.state.user}
db.state.password=${db.state.password}

db.caves.database=${db.caves.database}
db.caves.user=${db.caves.user}
db.caves.password=${db.caves.password}

db.skyblock.database=${db.skyblock.database}
db.skyblock.user=${db.skyblock.user}
db.skyblock.password=${db.skyblock.password}
