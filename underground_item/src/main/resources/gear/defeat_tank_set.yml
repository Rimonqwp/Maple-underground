set_bonus:
  description: "每擁有 50 點防禦力，即可獲得 +1 行走速度"
  speed_per_50_defense: 1

# 掉落規則：僅在地牢世界內擊殺「指定怪物類型」時才有機率掉落
# monster_type: 對應 monsters.yml 的 key（本插件地牢怪的 PDC 標記），例如坦克僵尸 = ZOMBIE_TANK
# chance: 掉落機率 0.0～1.0，例如 0.10 = 10%
drop:
  entity: ZOMBIE
  monster_type: ZOMBIE_TANK
  chance: 0.10

# 各樓層數值（F1 為圖片基礎，其餘為上一層 ×1.1 取整）
floors:
  F1:
    helmet:   { defense: 62,  speed: -5 }
    chest:    { defense: 112, speed: -5 }
    leggings: { defense: 92,  speed: -5 }
    boots:    { defense: 57,  speed: -5 }
  F2:
    helmet:   { defense: 68,  speed: -5 }
    chest:    { defense: 123, speed: -5 }
    leggings: { defense: 101, speed: -5 }
    boots:    { defense: 63,  speed: -5 }
  F3:
    helmet:   { defense: 75,  speed: -5 }
    chest:    { defense: 135, speed: -5 }
    leggings: { defense: 111, speed: -5 }
    boots:    { defense: 69,  speed: -5 }
