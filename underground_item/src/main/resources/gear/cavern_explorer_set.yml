# F2 深窟探險者套裝 - 地牢二層通用裝備，無職業加成，數值低於 F3 自適應套裝
# 總屬性約為 F3 自適應的 70%：42 力 / 360 血 / 170 防 / 42 智

set_id: cavern_explorer_set
display_name_prefix: "深窟探險者"

pieces:
  helmet: "&l&#7FAFFF深&#8AB2FF窟&#96B6FF探&#A1B9FF險&#ADBDFF者&#B8C0FF頭&#C4C4FF盔"
  chest: "&l&#7FAFFF深&#8AB2FF窟&#96B6FF探&#A1B9FF險&#ADBDFF者&#B8C0FF胸&#C4C4FF甲"
