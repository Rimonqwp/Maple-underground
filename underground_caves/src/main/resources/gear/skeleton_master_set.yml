# 冥界套裝 - Floor II (Scarf) 風格；擊殺地牢骷髏 2.5% 掉落。
# 每件箭矢傷害 +5%；套裝獎勵「Skeleton Master」：箭矢傷害 +25%（穿齊 4 件共 45%）。
# 胸甲額外：弓不消耗箭矢。

set_id: skeleton_master_set
display_name_prefix: "冥界套裝"

pieces:
  helmet: "&l&#B493FF冥&#CA98FF界&#E19DFF頭&#F7A2FF盔"
  chest: "&l&#B493FF冥&#CA98FF界&#E19DFF胸&#F7A2FF甲"
  leggings: "&l&#B493FF冥&#CA98FF界&#E19DFF護&#F7A2FF腿"
  boots: "&l&#B493FF冥&#CA98FF界&#E19DFF戰&#F7A2FF靴"

leather_color_hex: "#6B5B4F"

unbreakable: true

arrow_damage_percent_per_piece: 5
set_bonus_arrow_damage_percent: 25
# 胸甲專屬：弓不消耗箭矢（由 BowNoConsumeArrowListener 處理）
chestplate_bow_no_consume_arrow: true

drop:
  chance: 0.025
  entity_type: SKELETON

# F2 依圖（Floor II Scarf）；F1=F2/1.1，F3=F2×1.1 取整
