    leggings: { defense: 38,  health: 24,  crit_damage: 17,  crit_chance: 2 }
    boots:    { defense: 22,  health: 14,  crit_damage: 17,  crit_chance: 2 }
  F2:
    helmet:   { defense: 29,  health: 18,  crit_damage: 18,  crit_chance: 2 }
