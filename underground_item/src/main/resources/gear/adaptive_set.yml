# F3 自適應套裝（可改顯示名為「自適應裝備」）
# 稀有度: 史詩 | 總屬性: 60 力 / 515 血 / 245 防 / 60 智，平分四件
# 依所選地牢職業額外獲得加成（見 lore 與下方 class_bonus，需插件實作）

set_id: adaptive_set
display_name_prefix: "自適應裝備"

pieces:
  helmet: "&l&#C09BFF自&#C79EF8適&#CFA2F1應&#D6A5EA頭&#DDA9E3盔"
  chest: "&l&#C09BFF自&#C79EF8適&#CFA2F1應&#D6A5EA胸&#DDA9E3甲"
  leggings: "&l&#C09BFF自&#C79EF8適&#CFA2F1應&#D6A5EA護&#DDA9E3腿"
  boots: "&l&#C09BFF自&#C79EF8適&#CFA2F1應&#D6A5EA戰&#DDA9E3靴"

leather_color_hex: "#9b7bc0"

unbreakable: true

# 職業加成（供插件讀取實作）
class_bonus:
  berserk:   { strength: 20 }
  healer:    { mending: 5, health: 40 }
  mage:      { intelligence: 50 }
  tank:      { defense: 30, damage_reduction_per_piece_percent: 5, same_monster_seconds: 10 }
  archer:    { crit_chance: 5, crit_damage: 15 }

# 僅 F3 樓層 | 屬性分配：胸甲 > 護腿 > 頭盔 > 靴子
floors:
  F3:
    helmet:   { strength: 14, health: 117, defense: 56, intelligence: 14 }
    chest:    { strength: 19, health: 164, defense: 78, intelligence: 19 }
    leggings: { strength: 16, health: 140, defense: 67, intelligence: 16 }
    boots:    { strength: 11, health: 94,  defense: 44, intelligence: 11 }

