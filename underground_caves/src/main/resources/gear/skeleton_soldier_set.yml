# 白骨先鋒套裝 - 擊殺地牢骷髏 2.5% 掉落。
# 每件箭矢傷害 +5%；套裝獎勵「Skeleton Soldier」：箭矢傷害額外 +25%（穿齊 4 件共 45%）。
# F1 基礎屬性依圖 Floor I (Bonzo)：防禦/生命/暴擊傷害/暴擊機率；F2=F1×1.1，F3=F2×1.1

set_id: skeleton_soldier_set
display_name_prefix: "白骨先鋒套裝"

# 與白骨箭手套裝同款漸層：&l + &#B493FF→&#F7A2FF
pieces:
  helmet: "&l&#B493FF白&#C196FF骨&#CF99FF先&#DC9CFF鋒&#EA9FFF頭&#F7A2FF盔"
  chest: "&l&#B493FF白&#C196FF骨&#CF99FF先&#DC9CFF鋒&#EA9FFF胸&#F7A2FF甲"
  leggings: "&l&#B493FF白&#C196FF骨&#CF99FF先&#DC9CFF鋒&#EA9FFF護&#F7A2FF腿"
  boots: "&l&#B493FF白&#C196FF骨&#CF99FF先&#DC9CFF鋒&#EA9FFF戰&#F7A2FF靴"

leather_color_hex: "#8B7355"

unbreakable: true

# 每件 +5% 箭矢傷害；套裝獎勵額外 +25%
arrow_damage_percent_per_piece: 5
set_bonus_arrow_damage_percent: 25

drop:
  chance: 0.025
  entity_type: SKELETON

# 各樓層數值硬編碼（F1 依圖，F2=F1×1.1，F3=F2×1.1 取整）
