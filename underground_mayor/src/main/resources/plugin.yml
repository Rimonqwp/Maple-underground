name: underground_mayor
version: '26.3'

main: maple.underground_mayor.UndergroundMayor
api-version: '26.3'
load: POSTWORLD
depend:
  - Citizens
  - underground_state
commands:
  mayor:
    description: Manage mayor NPCs and mayor progress.
    usage: /mayor <spawn|progress|badgepreview [amount]|hide <npc|all>>
    permission: underground_mayor.admin
    permission-message: 你沒有權限使用這個指令。
permissions:
  underground_mayor.admin:
    default: op
