# 集中数据库凭据（编译期由 Maven 资源过滤注入；不要手动填真实密码）。
# 真实值来自 build-secrets.cmd -> build-all.cmd 传入的 -D 参数；默认值见 underground_state/pom.xml。
#
# 多数主机只給「一个数据库 + 一个账号」：所有功能共用下面这一组，靠「表名」区分，
# 而不是分成多个库。逻辑数据源名（state/caves/skyblock）目前都映射到这一组。
db.host=${db.host}
db.port=${db.port}
db.params=${db.params}

db.database=${db.database}
db.user=${db.user}
db.password=${db.password}

# 进阶（一般用不到）：若日后主机能开独立库，可在此为某个逻辑数据源覆盖，例如：
#   db.caves.database=...
#   db.caves.user=...
#   db.caves.password=...
# 未设定时一律回退到上面的共用 db.database/db.user/db.password。
