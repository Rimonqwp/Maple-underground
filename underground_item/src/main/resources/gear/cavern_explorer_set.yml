leather_color_hex: "#5a6b8a"

unbreakable: true

# 套裝效果：穿齊四件時生效（由插件按需實作）
set_bonus:
  name: "深窟路線記錄"
  description_main: "在地底洞窟中行走時更易尋路與閃避攻擊。"
  walk_speed_bonus: 5           # 建議解讀為 +5 行走速度（比 F3 自適應弱）
  damage_reduction_percent: 5   # 受到怪物傷害 -5%

# 僅 F2 樓層 | 屬性分配：胸甲 > 護腿 > 頭盔 > 靴子
floors:
  F2:
    helmet:   { strength: 10, health: 82,  defense: 39, intelligence: 10 }
    chest:    { strength: 13, health: 115, defense: 54, intelligence: 13 }
    leggings: { strength: 11, health: 98,  defense: 46, intelligence: 11 }
    boots:    { strength: 8,  health: 65,  defense: 31, intelligence: 8 }

