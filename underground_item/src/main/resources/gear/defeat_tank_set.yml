# 堅壁套裝 - 擊殺殭屍 10% 掉落。全身皮甲，套裝效果：每 50 防禦 +1 行走速度。
# 速度每件均為 -5；裝備僅 F1～F3。防禦 F2=F1×1.1，F3=F2×1.1（已算好實數）

set_id: defeat_tank
display_name_prefix: "&7&l堅壁套裝"
# 各部位顯示名稱：&#RRGGBB 每字一色（支援大寫 hex），例 &#8B9DC3堅&#9EA1B0壁
pieces:
  helmet: "&l&#79A4FF堅&#7DBEFF壁&#80D7FF頭&#84F1FF盔"
  chest: "&l&#79A4FF堅&#7DBEFF壁&#80D7FF胸&#84F1FF甲"
  leggings: "&l&#79A4FF堅&#7DBEFF壁&#80D7FF護&#84F1FF腿"
  boots: "&l&#79A4FF堅&#7DBEFF壁&#80D7FF戰&#84F1FF靴"
# 皮甲顏色：支援 #RRGGBB 或 leather_color_rgb: [R, G, B]
leather_color_hex: "#50505a"
leather_color_rgb: [ 80, 80, 90 ]

# 是否無法破壞（裝備不會因耐久耗盡而消失）
unbreakable: true

# 各部位 lore 分開設定（& 為顏色代碼；{defense}、{speed} 會替換為該件數值）
